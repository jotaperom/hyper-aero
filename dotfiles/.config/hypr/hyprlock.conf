general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = aeroGlide, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 5, aeroGlide
    animation = fadeOut, 1, 4, aeroGlide
    animation = inputFieldDots, 1, 2, aeroGlide
}

background {
    monitor =
    path = __HOME__/.config/hyper-aero/wallpapers/bg.jpg
    blur_passes = 3
    blur_size = 9
    noise = 0.01
    contrast = 0.95
    brightness = 1.0
    vibrancy = 0.2
}

label {
    monitor =
    text = ◢ HYPER·AERO
    font_family = Michroma
    font_size = 12
    color = rgba(1446c2ff)
    position = 32, -28
    halign = left
    valign = top
}

label {
    monitor =
    text = AIRLOCK // SESSION SEALED
    font_family = JetBrainsMono Nerd Font
    font_size = 10
    color = rgba(5a6270ff)
    position = -32, -30
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H:%M)"
    font_family = Michroma
    font_size = 92
    color = rgba(0b0d12ff)
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(ffffffcc)
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(LC_TIME=C date '+%A  ·  %d %B %Y' | tr a-z A-Z)"
    font_family = Exo 2
    font_size = 13
    color = rgba(5a6270ff)
    position = 0, 105
    halign = center
    valign = center
}

shape {
    monitor =
    size = 460, 220
    color = rgba(f5f8fbd9)
    rounding = 26
    border_size = 1
    border_color = rgba(0b0d12cc)
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0b0d1238)
    position = 0, -90
    halign = center
    valign = center
}

label {
    monitor =
    text = ◢ AIRLOCK
    font_family = Michroma
    font_size = 12
    color = rgba(0b0d12ff)
    position = 0, -22
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 54
    outline_thickness = 2
    rounding = -1
    outer_color = rgba(1446c2ff) rgba(3d9be9ff) 45deg
    inner_color = rgba(ffffffee)
    font_color = rgba(0b0d12ff)
    font_family = JetBrainsMono Nerd Font
    check_color = rgba(a8650aff) rgba(d4880fff) 45deg
    fail_color = rgba(c4283bff) rgba(e5484dff) 45deg
    capslock_color = rgba(a8650aff)
    dots_size = 0.24
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    placeholder_text = ENTER ACCESS CODE
    fail_text = <b>ACCESS DENIED</b>  ·  ATTEMPT $ATTEMPTS
    position = 0, -92
    halign = center
    valign = center
}

label {
    monitor =
    text = OPERATOR  ·  $USER
    font_family = JetBrainsMono Nerd Font
    font_size = 10
    color = rgba(5a6270ff)
    position = 0, -158
    halign = center
    valign = center
}

label {
    monitor =
    text = HYPER·AERO OS  ·  DECK BUILD 26.10
    font_family = JetBrainsMono Nerd Font
    font_size = 9
    color = rgba(5a6270ff)
    position = 32, 26
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:10000] echo "BAT $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null)%  ·  $(cat /sys/class/power_supply/BAT*/status 2>/dev/null | tr a-z A-Z)"
    font_family = JetBrainsMono Nerd Font
    font_size = 9
    color = rgba(0b0d12ff)
    position = -32, 26
    halign = right
    valign = bottom
}
